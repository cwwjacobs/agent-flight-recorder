[project]
name = "afr-sdk"
version = "0.2.0"
description = "Agent Flight Recorder SDK — record model calls, tool calls, state, and checkpoints from your agent"
requires-python = ">=3.10"
maintainers = [{ name = "Corey Jacobs" }]
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/cwwjacobs/agent-flight-recorder"
Repository = "https://github.com/cwwjacobs/agent-flight-recorder"
Issues = "https://github.com/cwwjacobs/agent-flight-recorder/issues"
Documentation = "https://github.com/cwwjacobs/agent-flight-recorder/tree/main/docs"

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["afr*"]
