[project]
name = "afr-cli"
version = "0.3.0"
description = "Agent Flight Recorder CLI"
requires-python = ">=3.10"
authors = [{ name = "Corey Jacobs", email = "coresynth@gmail.com" }]
maintainers = [{ name = "Corey Jacobs", email = "coresynth@gmail.com" }]
license = { text = "PolyForm-Noncommercial-1.0.0" }
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "afr-sdk",
]

[project.urls]
Homepage = "https://github.com/cwwjacobs/agent-flight-recorder"
Repository = "https://github.com/cwwjacobs/agent-flight-recorder"
Issues = "https://github.com/cwwjacobs/agent-flight-recorder/issues"
Documentation = "https://github.com/cwwjacobs/agent-flight-recorder/tree/main/docs"

[project.scripts]
afr = "afr_cli.main:main"
afr-regression-case = "afr_cli.regression_case:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["afr_cli*"]
